name: Build and deploy site

on:
  push:
    branches: [main]
    paths:
      - '**/*.txt'
      - 'INDEX.md'
      - 'VERSIONS.md'
      - 'README.md'
      - 'build_site.py'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required, not a convenience. build_site.py derives
          # each page's sitemap <lastmod> from `git log -1 --format=%cs` on the
          # source .txt. With the default fetch-depth: 1 every file's "last
          # commit" is HEAD, so all 1851 URLs would claim they changed on build
          # day, every day — the exact false signal that teaches a crawler to
          # distrust lastmod. Shallow clone = silently broken dates.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locate builder
        id: find
        run: |
          if [ -f scripts/build_site.py ]; then
            echo "path=scripts/build_site.py" >> "$GITHUB_OUTPUT"
          elif [ -f build_site.py ]; then
            echo "path=build_site.py" >> "$GITHUB_OUTPUT"
          else
            echo "::error::build_site.py not found at scripts/build_site.py or repo root"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - name: Build
        # SITE_BASE selects the deploy shape. The builder defaults to "" (root
        # site, https://poehl60.github.io/) because this repo is now named
        # Poehl60.github.io. Only override for a project-path deploy:
        #     SITE_BASE=/Framework python3 ...
        # Do NOT derive this from the repo name with `cond && '' || x` —
        # GitHub Actions treats "" as falsy, so an empty-string branch is
        # unreachable and the expression silently picks the fallback
        # [bug found 2026-11-06]. An explicit literal is unambiguous.
        env:
          SITE_BASE: ""
        run: python3 "${{ steps.find.outputs.path }}"

      - name: Social card
        run: |
          if [ -f og.png ]; then echo "og.png present"; else echo "::warning::og.png missing — og:image will 404"; fi

      - name: Report size
        run: |
          echo "pages: $(find docs -name '*.html' | wc -l)"
          echo "urls:  $(grep -c '<url>' docs/sitemap.xml)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
